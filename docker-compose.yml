version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: spi_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: spi_erp
      POSTGRES_USER: spi_user
      POSTGRES_PASSWORD: spi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spi_user -d spi_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-node:
    build:
      context: ./api-node
      dockerfile: Dockerfile
    container_name: spi_erp_api_node
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: spi_erp
      DB_USER: spi_user
      DB_PASSWORD: spi_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api-node:/app
      - /app/node_modules

  api-python:
    build:
      context: ./api-python
      dockerfile: Dockerfile
    container_name: spi_erp_api_python
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: spi_erp
      DB_USER: spi_user
      DB_PASSWORD: spi_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api-python:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spi_erp_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api-node
      - api-python
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
