

services:
  # ============================================================
  # PostgreSQL - Base de datos principal
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: spi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spi_erp
      POSTGRES_USER: spi_user
      POSTGRES_PASSWORD: spi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/migration_v3.sql:/docker-entrypoint-initdb.d/02_migration_v3.sql
      - ./db/migration_v4.sql:/docker-entrypoint-initdb.d/03_migration_v4.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spi_user -d spi_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # API Node.js - Backend principal (CRUD, Auth, Ventas, Catálogos)
  # ============================================================
  api-node:
    build:
      context: ./api-node
      dockerfile: Dockerfile
    container_name: spi-api-node
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: spi_erp
      DB_USER: spi_user
      DB_PASSWORD: spi_password
      JWT_SECRET: spi_erp_jwt_secret_key_2026
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api-node:/app
      - /app/node_modules

  # ============================================================
  # API Python - Backend de procesamiento (Fiscal CFDI 4.0)
  # ============================================================
  api-python:
    build:
      context: ./api-python
      dockerfile: Dockerfile
    container_name: spi-api-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: spi_erp
      DB_USER: spi_user
      DB_PASSWORD: spi_password
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api-python:/app

  # ============================================================
  # Frontend Vue.js - Interfaz de usuario
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spi-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_NODE_URL: http://localhost:3000
      VITE_API_PYTHON_URL: http://localhost:8000
    depends_on:
      - api-node
      - api-python
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
